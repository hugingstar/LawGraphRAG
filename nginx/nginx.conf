events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 조문 분석 응답이 커서(HTML + 인용문) 기본 버퍼로는 디스크로 샌다.
    client_max_body_size 20m;

    server {
        listen 80;
        server_name localhost;

        # /analyze/stream 은 SSE(StreamingResponse) 다. proxy_buffering 이 켜져 있으면
        # nginx 가 응답을 모아뒀다 한 번에 내보내서, 스트리밍이 통째로 멈춘 것처럼 보인다.
        location /analyze/stream {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # LLM 호출이 길어질 수 있어 기본 60s 로는 끊긴다.
            proxy_read_timeout 600s;
        }

        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }
    }
}
