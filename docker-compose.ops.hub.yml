# 모니터링 스택 배포용 — ops 이미지를 빌드하지 않고 Docker Hub 에서 pull 한다.
#
#   docker compose -f docker-compose.ops.hub.yml --env-file .env.ops pull
#   docker compose -f docker-compose.ops.hub.yml --env-file .env.ops up -d
#
# docker-compose.ops.yml 과 유일한 차이는 ops 서비스의 build: 를 뺀 것이다.
# 나머지(별도 프로젝트 이름, host-gateway, 127.0.0.1 바인딩)는 그대로 지킨다.
name: lawgraphrag-ops

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

networks:
  app:
    name: ${APP_NETWORK:-lawgraphrag_default}
    external: true

services:
  ops:
    image: yslee4050/lawowly-ops:${OPS_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env.ops
        required: false
    ports:
      - "127.0.0.1:8900:8900"
    # 앱 스택이 api/db/neo4j 를 127.0.0.1 에만 묶어 두므로(README 참고), host-gateway 로는
    # 더 이상 닿지 않는다. 대신 app 네트워크에 직접 붙어 컨테이너 이름으로 본다.
    networks:
      default: {}
      app: {}
    volumes:
      - ops_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8900/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    env_file:
      - path: .env.ops
        required: false
    networks:
      default: {}
      app: {}

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./ops/prometheus/rules.yml:/etc/prometheus/rules.yml:ro,z
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    env_file:
      - path: .env.ops
        required: false
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - ./ops/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro,z
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    env_file:
      - path: .env.ops
        required: false
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  ops_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
