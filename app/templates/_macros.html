{# 시·도 -> 시·군·구 2단 셀렉트. 회원가입/설정/사건작성이 같은 마크업을 쓰므로 매크로로 모은다.
   시군구 <option>은 서버에서 렌더하지 않고 app/static/regions.js가 시도 선택에 따라 채운다
   (250개를 세 화면에 매번 렌더하면 HTML만 커지고 어차피 대부분 안 쓰인다).
   data-selected는 편집 화면에서 기존 선택값을 복원하기 위한 힌트다. #}
{% macro region_selects(sido_list, selected_sido='', selected_sigungu='', required=False) %}
<div class="field-row">
  <div class="field">
    <label class="field-label" for="sido_code">시·도 {% if required %}<span class="required-mark">*</span>{% endif %}</label>
    <select id="sido_code" name="sido_code" data-region-sido {% if required %}required{% endif %}>
      <option value="">시·도 선택</option>
      {% for s in sido_list %}
      <option value="{{ s.code }}" {{ "selected" if selected_sido == s.code else "" }}>{{ s.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label class="field-label" for="sigungu_code">시·군·구 {% if required %}<span class="required-mark">*</span>{% endif %}</label>
    <select id="sigungu_code" name="sigungu_code" data-region-sigungu data-selected="{{ selected_sigungu or '' }}" {% if required %}required{% endif %}>
      <option value="">시·군·구 선택</option>
    </select>
  </div>
</div>
{% endmacro %}

{# "활성화 된 법" 카드. Advisor·나의 요청·전국 사건 모니터링 세 화면에서 똑같이 쓰므로
   매크로로 모은다. 각 페이지 라우터가 available_laws(법령명 리스트)를 넘긴다. #}
{% macro law_list_card(available_laws) %}
<section class="card law-list-card">
  <div class="law-list-head">
    <h2 class="card-title">활성화 된 법</h2>
    <button type="button" class="btn-link-small" data-open-law-modal>법 활성화</button>
  </div>
  <p class="hint law-list-hint">아래 법을 우선순위로 두고 검색합니다.</p>
  {% if available_laws %}
  <ul class="law-list">
    {% for name in available_laws %}
    <li>{{ name }}</li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty-state">아직 수집된 법령이 없습니다.</p>
  {% endif %}
</section>
{% endmacro %}

{# 설정 페이지 좌측 사이드 메뉴. active_tab: 'profile' | 'laws' #}
{% macro settings_sidebar(active_tab) %}
<nav class="settings-sidebar">
  <a href="/settings" class="{{ 'active' if active_tab == 'profile' else '' }}">내 정보</a>
  <a href="/settings/laws" class="{{ 'active' if active_tab == 'laws' else '' }}">법 활성화</a>
</nav>
{% endmacro %}
