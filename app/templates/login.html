{% extends "_layout.html" %}
{% block content %}
      <div class="auth-wrap">
        <div class="hero">
          <h1>로그인</h1>
          <p class="hint">Law Owly 심층 검토 시스템에 로그인하세요.</p>
        </div>

        <section class="card input-card">
          <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next or '/dashboard' }}">
            {% if error %}
            <p class="form-error">{{ error }}</p>
            {% endif %}
            {% if deleted %}
            <p class="form-success">회원 탈퇴가 완료되었습니다. 그동안 이용해 주셔서 감사합니다.</p>
            {% endif %}

            <div class="field">
              <label class="field-label" for="username">아이디</label>
              <input class="text-input" type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>
            </div>

            <div class="field">
              <label class="field-label" for="password">비밀번호</label>
              <input class="text-input" type="password" id="password" name="password" required>
            </div>

            <div class="action-row">
              <button type="submit">로그인</button>
            </div>
          </form>
        </section>

        <p class="hint auth-alt">계정이 없으신가요? <a href="/signup">회원가입</a></p>
      </div>
{% endblock %}
